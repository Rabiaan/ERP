name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    env:
      CI_POSTGRES_PASSWORD: ci-postgres-password
      CI_PLATFORM_APP_PASSWORD: ci-platform-app-password
      CI_PLATFORM_MIGRATOR_PASSWORD: ci-platform-migrator-password
      CI_APP_SECRET: ci_app_secret_at_least_32_characters_123

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: erp_platform
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-postgres-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d erp_platform"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Create CI environment
        run: |
          POSTGRES_PASSWORD="${{ env.CI_POSTGRES_PASSWORD }}"
          PLATFORM_APP_PASSWORD="${{ env.CI_PLATFORM_APP_PASSWORD }}"
          PLATFORM_MIGRATOR_PASSWORD="${{ env.CI_PLATFORM_MIGRATOR_PASSWORD }}"
          APP_SECRET="${{ env.CI_APP_SECRET }}"
          KMS_LOCAL_KEY="$(openssl rand -base64 32)"
          cat > .env <<EOF
          NODE_ENV="test"
          APP_URL="http://localhost:3000"
          PORT="3001"
          BOOT_STRICT="true"
          POSTGRES_PASSWORD="${POSTGRES_PASSWORD}"
          PLATFORM_ADMIN_URL="postgres://postgres:${POSTGRES_PASSWORD}@localhost:5432/erp_platform"
          PLATFORM_DATABASE_URL="postgres://lilac_platform_app:${PLATFORM_APP_PASSWORD}@localhost:5432/erp_platform"
          PLATFORM_APP_PASSWORD="${PLATFORM_APP_PASSWORD}"
          PLATFORM_MIGRATOR_PASSWORD="${PLATFORM_MIGRATOR_PASSWORD}"
          APP_SECRET="${APP_SECRET}"
          KMS_LOCAL_KEY="${KMS_LOCAL_KEY}"
          EOF

      - run: npm ci
      - run: npm run db:migrate
      - run: npm run db:provision:setup
      - run: npm run db:seed
      - run: npm run typecheck
      - run: npm run build:all
      - run: npm test
      - run: npm run security:gates
